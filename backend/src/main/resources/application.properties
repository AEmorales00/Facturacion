# ============================================================
#  CONFIGURACION DEL BACKEND - Sistema de Facturacion
# ------------------------------------------------------------
#  Este archivo trae los valores para trabajar en la computadora.
#  En produccion todo se sobrescribe con VARIABLES DE ENTORNO,
#  que es la forma de no subir credenciales al repositorio.
# ============================================================

spring.application.name=facturacion-api
server.port=${PORT:8080}

# ------------------------------------------------------------
#  BASE DE DATOS
# ------------------------------------------------------------
#  Por omision se usa H2 guardado en un archivo: no hay que
#  instalar nada y los datos sobreviven al reiniciar.
#  Para la nube se cambian estas tres variables de entorno:
#    DB_URL=jdbc:mysql://host:3306/facturacion
#    DB_USER=usuario
#    DB_PASSWORD=clave
# ------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:file:./datos/facturacion;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate crea y actualiza las tablas solo, a partir de las clases @Entity.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Poner en true para ver en consola el SQL que genera Hibernate.
spring.jpa.show-sql=false

# Consola web de H2 para inspeccionar los datos: http://localhost:8080/h2
spring.h2.console.enabled=true
spring.h2.console.path=/h2

# ------------------------------------------------------------
#  ALMACENAMIENTO DE IMAGENES
# ------------------------------------------------------------
#  local -> guarda en la carpeta ./uploads (para desarrollar sin AWS)
#  s3    -> sube al bucket de Amazon S3 (lo que se entrega)
# ------------------------------------------------------------
app.almacenamiento=${ALMACENAMIENTO:local}

app.local.carpeta=uploads
app.local.url-base=/imagenes
# URL publica del propio backend. Se usa para armar los enlaces de las
# imagenes en modo local; al desplegar se pone la URL real de la API.
app.url-publica=${URL_PUBLICA:http://localhost:8080}

app.s3.bucket=${S3_BUCKET:}
app.s3.region=${AWS_REGION:us-east-1}
app.s3.prefijo=productos/
# true: bucket privado con URLs firmadas que vencen (recomendado)
# false: bucket publico con URL directa y permanente
app.s3.urls-firmadas=${S3_URLS_FIRMADAS:true}
app.s3.minutos-firma=60

# Tamano maximo de la fotografia que se puede subir
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ------------------------------------------------------------
#  CORS: desde que direcciones puede llamarse a la API
# ------------------------------------------------------------
#  En produccion se pone la URL del Angular desplegado, por ejemplo:
#  CORS_ORIGENES=https://facturacion.vercel.app
# ------------------------------------------------------------
app.cors.origenes=${CORS_ORIGENES:http://localhost:4200,http://localhost:4300}

# ------------------------------------------------------------
#  REGLAS DEL NEGOCIO
# ------------------------------------------------------------
# IVA de Guatemala
app.iva=0.12
# Carga los clientes y productos de prueba si la base esta vacia
app.datos-iniciales=true

# Web Service del Banco de Guatemala (tiene que ser https)
app.banguat.url=https://www.banguat.gob.gt/variables/ws/TipoCambio.asmx
app.banguat.timeout-segundos=10

# ------------------------------------------------------------
#  REGISTRO DE EVENTOS
# ------------------------------------------------------------
logging.level.gt.edu.facturacion=INFO
